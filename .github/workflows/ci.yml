name: CI

on:
  push:
    branches: [ main, "jules/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Node project
        run: npm run build

      - name: Run Node tests
        run: npm run test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pytest-cov
          pip install -e .

      - name: Run Python unit tests
        run: |
          python -m pytest -v --tb=short

      - name: Run gitted self-lint
        run: |
          python -m gitted.cli lint --repo . --adr-dir docs/adr || true
