[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitted"
version = "0.1.0"
description = "Automated AST code anchor validation and active status lifecycle engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gitted = "gitted.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

